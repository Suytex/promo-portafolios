<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Suytex Portafolio Experience</title>
  <meta name="description" content="Aprende a construir un portafolio de acciones con método — en 5 días." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Design system: suytex.css importa las fuentes (Space Grotesk + Inter);
       theme-light.css es la capa semantica light y exige data-theme="light". -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Suytex/suytex-design@v1.2.0/suytex.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Suytex/suytex-design@v1.2.0/theme-light.css">

  <style>
    /* ═══════════════════════════════════════════════════════════
       Solo lo que el design system NO cubre: layout, grids,
       acordeon FAQ, columnas si/no y los botones. Color, tipografia,
       radius y espaciado salen de los tokens --su-*.
       ═══════════════════════════════════════════════════════════ */

    /* ─── RESET ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    img { max-width: 100%; display: block; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }

    /* ─── LAYOUT ─────────────────────────────────────────────── */
    .container { max-width: var(--su-maxw); margin: 0 auto; padding: 0 24px; }
    .section { padding: var(--su-section-y) 0; }
    /* Alternancia por orden de aparicion: si se reordenan las secciones en
       content.txt, el ritmo bg / bg-alt se mantiene solo. Sin divisorias. */
    #app .section:nth-of-type(even) { background: var(--su-bg-alt); }

    /* ─── TIPOGRAFIA ─────────────────────────────────────────── */
    /* Escala de seccion propia. theme-light.css fija font-size dentro de
       [data-theme="light"] .su-title (especificidad 0,2,0), asi que aplicar
       .su-title a los 13 h2 los dejaria a tamano hero. */
    [data-theme="light"] #app .section h2 {
      font-family: var(--su-font-display);
      font-weight: 600;
      font-size: clamp(1.75rem, 3.2vw, 2.5rem);
      letter-spacing: -0.02em;
      line-height: 1.12;
      color: var(--su-fg);
      margin-bottom: 20px;
    }
    #app .section h3 {
      font-family: var(--su-font-display);
      font-weight: 600;
      font-size: 1.25rem;
      letter-spacing: -0.01em;
      color: var(--su-fg);
    }
    #app .section p {
      font-family: var(--su-font-body);
      font-weight: 400;
      font-size: 1.0625rem;
      line-height: 1.6;
      color: var(--su-fg-muted);
      max-width: 68ch;
      margin-bottom: 16px;
    }
    #app .section li {
      font-family: var(--su-font-body);
      font-weight: 400;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--su-fg-muted);
    }
    #app .section strong { color: var(--su-fg); font-weight: 500; }
    #app .section ul { margin-top: 40px; }

    /* Entradilla atenuada: el h2 hace de pie y el <strong> siguiente carga
       la declaracion (problem, philosophy, pricing). */
    [data-theme="light"] #app .section--problem h2,
    [data-theme="light"] #app .section--philosophy h2,
    [data-theme="light"] #app .section--pricing h2 {
      font-size: clamp(1.375rem, 2.2vw, 1.75rem);
      font-weight: 500;
      letter-spacing: -0.01em;
      color: var(--su-fg-muted);
    }
    #app .section--problem > .container > p:first-of-type strong,
    #app .section--philosophy > .container > p:first-of-type strong {
      display: block;
      font-family: var(--su-font-display);
      font-weight: 600;
      font-size: clamp(1.75rem, 3.2vw, 2.5rem);
      letter-spacing: -0.02em;
      line-height: 1.12;
      color: var(--su-fg);
      margin-bottom: 24px;
    }

    /* ─── ICONOS ─────────────────────────────────────────────── */
    /* .su-icon (suytex.css) aporta 24x24 + stroke; el <svg> lo inyecta
       enhanceIcons(), no el auto-render de icons.js — esta landing pinta su
       contenido despues de DOMContentLoaded y ese auto-render es de una
       sola pasada. La clase es obligatoria: sin ella el <use> hereda
       fill:black / stroke:none y el icono sale como mancha negra. */
    [data-theme="light"] .su-icon {
      display: inline-flex;
      flex: none;
      vertical-align: -0.25em;
    }

    /* ─── HERO ───────────────────────────────────────────────── */
    #app .section--hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: calc(var(--su-section-y) + 24px) 0;
    }
    #app .section--hero .container { width: 100%; }
    #app .section--hero h1 {
      font-family: var(--su-font-body);
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--su-fg-muted);
      margin-bottom: 24px;
    }
    [data-theme="light"] #app .section--hero h2 {
      font-size: clamp(2.125rem, 5vw, 3.5rem);
      max-width: 24ch;
      margin-bottom: 24px;
    }
    #app .section--hero > .container > p:first-of-type {
      font-size: clamp(1.0625rem, 1.6vw, 1.3125rem);
      max-width: 46ch;
      margin-bottom: 40px;
    }
    #app .section--hero > .container > p:last-of-type { margin-bottom: 0; }

    /* ─── CARDS ──────────────────────────────────────────────── */
    /* .su-card no es alcanzable desde markdown (marked genera <li> pelados),
       asi que se replican sus valores del tema light con los mismos tokens. */
    #app .section--pain li,
    #app .section--transformation li,
    #app .section--method li,
    #app .section--format li,
    #app .section--outcomes li,
    #app .section--includes li,
    #app .for-who-col,
    #app .pricing-card,
    #app .faq-item {
      background: var(--su-surface);
      border: 1px solid var(--su-line-subtle);
      border-radius: var(--su-radius-md);
      box-shadow: none;
    }

    /* Cards apiladas: icono arriba, etiqueta, cuerpo. */
    #app .section--pain ul,
    #app .section--transformation ul,
    #app .section--method ul,
    #app .section--format ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 24px;
    }
    #app .section--pain li,
    #app .section--transformation li,
    #app .section--method li,
    #app .section--format li { padding: 28px; }
    #app .section--pain li .su-icon,
    #app .section--transformation li .su-icon,
    #app .section--method li .su-icon,
    #app .section--format li .su-icon {
      display: block;
      margin-bottom: 16px;
    }
    #app .section--pain li strong,
    #app .section--transformation li strong,
    #app .section--method li strong,
    #app .section--format li strong {
      display: block;
      font-size: 1.0625rem;
      margin-bottom: 6px;
    }

    /* Filas con sangria francesa: el icono va absoluto para que el texto
       envuelva alineado y no se parta en items de flex. */
    #app .section--outcomes ul,
    #app .section--includes ul {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
    }
    #app .section--outcomes li,
    #app .section--includes li {
      position: relative;
      padding: 20px 22px 20px 56px;
    }
    #app .section--outcomes li .su-icon,
    #app .section--includes li .su-icon {
      position: absolute;
      left: 22px;
      top: 21px;
    }
    #app .section--outcomes li strong,
    #app .section--includes li strong { display: block; margin-bottom: 4px; }

    /* ─── METHOD: subtitulo ──────────────────────────────────── */
    #app .section--method > .container > p:first-of-type {
      font-family: var(--su-font-body);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--su-fg-muted);
      margin-bottom: 8px;
    }

    /* ─── FOR-WHO ────────────────────────────────────────────── */
    #app .for-who-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      margin-top: 40px;
    }
    #app .for-who-col { padding: 32px; }
    #app .for-who-col h3 {
      position: relative;
      padding-left: 34px;
      margin-bottom: 20px;
    }
    #app .for-who-col ul {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 0;
    }
    #app .for-who-col li { position: relative; padding-left: 34px; }
    #app .for-who-col h3 .su-icon,
    #app .for-who-col li .su-icon { position: absolute; left: 0; top: 2px; }
    /* La columna NO se diferencia por glifo (x-circle) y por un neutro del
       propio sistema — no se introduce ningun color fuera del DS. */
    [data-theme="light"] #app .for-who-no .su-icon { stroke: var(--su-fg-subtle); }
    #app .section--for-who > .container > p { margin-top: 32px; }

    /* ─── PRICING ────────────────────────────────────────────── */
    #app .pricing-card {
      max-width: 560px;
      padding: 40px;
      margin-top: 40px;
      border-color: var(--su-line);
      border-radius: var(--su-radius-lg);
    }
    #app .price-main strong,
    #app .price-seats strong {
      display: block;
      font-family: var(--su-font-display);
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--su-fg);
    }
    #app .price-main strong { font-size: clamp(2.25rem, 5vw, 3rem); line-height: 1.05; }
    #app .price-seats strong { font-size: 1.375rem; line-height: 1.2; }
    #app .price-subtitle,
    #app .price-note { margin-bottom: 28px; }
    #app .price-closing {
      border-top: 1px solid var(--su-line-subtle);
      padding-top: 24px;
      margin-bottom: 0;
      font-size: 0.9375rem;
    }

    /* ─── FAQ ────────────────────────────────────────────────── */
    #app .faq-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-width: 760px;
      margin-top: 40px;
    }
    #app .faq-item { overflow: hidden; }
    #app .faq-q {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 20px 24px;
      cursor: pointer;
      user-select: none;
      font-family: var(--su-font-body);
      font-weight: 500;
      font-size: 1.0625rem;
      color: var(--su-fg);
    }
    #app .faq-q::after {
      content: '+';
      font-size: 1.5rem;
      font-weight: 300;
      line-height: 1;
      color: var(--su-accent);
      flex-shrink: 0;
      transition: transform .2s;
    }
    #app .faq-item.open .faq-q::after { transform: rotate(45deg); }
    /* 0fr → 1fr dimensiona la respuesta sola: sin max-height magica que
       recorte cuando el tema light agranda el cuerpo de texto. */
    #app .faq-a {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .3s ease;
    }
    #app .faq-item.open .faq-a { grid-template-rows: 1fr; }
    /* El padding va aparte del estado cerrado: en un grid item el padding no
       se comprime, y con 0fr dejaria una franja fantasma bajo la pregunta. */
    #app .faq-a-inner {
      overflow: hidden;
      padding: 0 24px;
      transition: padding-bottom .3s ease;
      font-family: var(--su-font-body);
      font-size: 1rem;
      line-height: 1.6;
      color: var(--su-fg-muted);
    }
    #app .faq-item.open .faq-a-inner { padding-bottom: 22px; }

    /* ─── BOTONES ────────────────────────────────────────────── */
    /* Receta de preview/light.html:28-47 del design system. Anadido propio:
       gap, para el icono que el preview no contempla. */
    #app .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 48px;
      padding: 0 28px;
      font-family: var(--su-font-body);
      font-weight: 500;
      font-size: 15px;
      border-radius: var(--su-radius-pill);
      cursor: pointer;
      border: 1px solid transparent;
      text-decoration: none;
    }
    #app .btn-primary { background: var(--su-accent); color: var(--su-on-accent); }
    #app .btn-primary:hover { background: var(--su-accent-hover); }
    #app .btn-secondary {
      background: transparent;
      color: var(--su-accent);
      border-color: var(--su-line);
    }
    #app .btn-secondary:hover { background: var(--su-accent-soft); }
    /* Dentro de un pill relleno el icono sigue al texto, no al acento. */
    [data-theme="light"] #app .btn-primary .su-icon { stroke: currentColor; }
    /* enhanceCTA inserta el boton entre el cuerpo y el cierre en cursiva. */
    #app .section--cta .btn { margin: 8px 0 36px; }

    /* ─── FOOTER ─────────────────────────────────────────────── */
    footer { background: var(--su-bg-alt); }
    footer .container { padding-top: 32px; padding-bottom: 32px; }
    footer span {
      font-family: var(--su-font-body);
      font-size: 13px;
      color: var(--su-fg-subtle);
    }

    /* ─── ESTADOS: CARGA Y ERROR ─────────────────────────────── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: var(--su-font-body);
      font-size: 15px;
      letter-spacing: 0.04em;
      color: var(--su-fg-subtle);
    }
    .loading::after {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--su-accent);
      border-radius: 50%;
      margin-left: 10px;
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

    .error-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px;
      text-align: center;
      gap: 16px;
      font-family: var(--su-font-body);
    }
    .error-state p { max-width: 46ch; color: var(--su-fg-muted); line-height: 1.6; }
    .error-state .error-title { color: var(--su-fg); font-weight: 500; font-size: 1.0625rem; }
    .error-state code {
      background: var(--su-bg-alt);
      border: 1px solid var(--su-line-subtle);
      border-radius: var(--su-radius-sm);
      padding: 2px 6px;
      font-size: .9em;
    }
    .error-state small { color: var(--su-fg-subtle); font-size: 13px; }

    /* ─── RESPONSIVE ─────────────────────────────────────────── */
    /* --su-section-y ya baja a 64px en <=768px desde theme-light.css:
       no se redeclara aqui. Este tramo intermedio existe porque con
       --su-maxw 980px las columnas de outcomes/includes son las primeras
       en quedarse sin ancho. */
    @media (max-width: 1024px) {
      #app .section--outcomes ul,
      #app .section--includes ul { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
      #app .section--pain ul,
      #app .section--transformation ul,
      #app .section--method ul,
      #app .section--format ul { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
      #app .pricing-card { padding: 32px; }
    }
    @media (max-width: 768px) {
      .container { padding: 0 20px; }
      #app .section--pain li,
      #app .section--transformation li,
      #app .section--method li,
      #app .section--format li { padding: 24px; }
      #app .for-who-col { padding: 28px; }
    }
    @media (max-width: 640px) {
      #app .section--pain ul,
      #app .section--transformation ul,
      #app .section--method ul,
      #app .section--format ul,
      #app .section--outcomes ul,
      #app .section--includes ul { grid-template-columns: 1fr; }
      #app .for-who-grid { grid-template-columns: 1fr; }
      #app .pricing-card { padding: 28px 24px; }
      /* Etiqueta larga: el pill de altura fija no cabe a 375px. */
      #app .btn {
        height: auto;
        min-height: 48px;
        padding: 14px 24px;
        line-height: 1.35;
        max-width: 100%;
      }
    }
  </style>
</head>
<body class="su-surface">

  <div id="app">
    <div class="loading">Cargando</div>
  </div>

  <footer id="footer" style="display:none">
    <div class="container"><span id="footer-brand"></span></div>
  </footer>

  <!-- marked.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
  <!-- sprite de iconos del design system (define window.suIcon) -->
  <script src="https://cdn.jsdelivr.net/gh/Suytex/suytex-design@v1.2.0/icons.js"></script>

  <script>
  // ─── MARKDOWN PARSER CONFIG ────────────────────────────────
  marked.setOptions({ breaks: true, gfm: true });

  // ─── DOM READY ────────────────────────────────────────────
  // icons.js inyecta el sprite en DOMContentLoaded. Esperarlo antes de
  // pintar garantiza que los <use href="#su-*"> de enhanceIcons resuelvan
  // incluso si el fetch responde desde cache antes de ese evento.
  function domReady() {
    return document.readyState === 'loading'
      ? new Promise(r => document.addEventListener('DOMContentLoaded', r, { once: true }))
      : Promise.resolve();
  }

  // ─── PARSE FRONTMATTER ────────────────────────────────────
  function parseFrontmatter(text) {
    const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n/);
    if (!match) return { meta: {}, body: text };
    const meta = {};
    match[1].split('\n').forEach(line => {
      const idx = line.indexOf(':');
      if (idx < 0) return;
      const key = line.slice(0, idx).trim();
      const val = line.slice(idx + 1).trim();
      if (key) meta[key] = val;
    });
    return { meta, body: text.slice(match[0].length) };
  }

  // ─── PARSE SECTIONS ───────────────────────────────────────
  function parseSections(body) {
    const parts = body.split(/<!--\s*section:\s*([\w-]+)\s*-->/);
    const sections = [];
    // parts[0] is content before first marker (ignored)
    for (let i = 1; i < parts.length; i += 2) {
      const type    = parts[i].trim();
      const content = (parts[i + 1] || '').trim();
      if (content) sections.push({ type, content });
    }
    return sections;
  }

  // ─── BUILD SECTION HTML ───────────────────────────────────
  function buildSection(section) {
    const html    = marked.parse(section.content);
    const anchor  = section.type === 'cta' ? ' id="reserva"' : '';
    return `<section class="section section--${section.type}"${anchor}>
      <div class="container">${html}</div>
    </section>`;
  }

  // ─── POST-PROCESS: FOR-WHO ────────────────────────────────
  function enhanceForWho() {
    const container = document.querySelector('.section--for-who .container');
    if (!container) return;
    try {
      const h2   = container.querySelector(':scope > h2');
      const h3s  = [...container.querySelectorAll(':scope > h3')];
      if (h3s.length < 2) return;

      const grid   = document.createElement('div');
      grid.className = 'for-who-grid';
      const yesCol = document.createElement('div');
      yesCol.className = 'for-who-col for-who-yes';
      const noCol  = document.createElement('div');
      noCol.className = 'for-who-col for-who-no';

      // Snapshot before moving anything
      const allEls = [...container.children];
      let zone = 'skip';
      for (const el of allEls) {
        if (el === h2) continue;
        if (el === h3s[0]) zone = 'yes';
        if (el === h3s[1]) zone = 'no';
        if (zone === 'yes') yesCol.appendChild(el);
        else if (zone === 'no') noCol.appendChild(el);
      }

      // Pull the closing <p> (if any) out of noCol so it renders below the grid
      const lastNoEl = noCol.lastElementChild;
      const closingP = (lastNoEl && lastNoEl.tagName === 'P') ? noCol.removeChild(lastNoEl) : null;

      grid.appendChild(yesCol);
      grid.appendChild(noCol);

      container.innerHTML = '';
      if (h2) container.appendChild(h2);
      container.appendChild(grid);
      if (closingP) container.appendChild(closingP);
    } catch (e) {
      console.warn('enhanceForWho failed:', e);
    }
  }

  // ─── POST-PROCESS: PRICING ────────────────────────────────
  function enhancePricing() {
    const container = document.querySelector('.section--pricing .container');
    if (!container) return;
    try {
      const card = document.createElement('div');
      card.className = 'pricing-card';

      const nodes = [...container.childNodes];
      let inCard = false;
      const cardNodes = [];
      const outerNodes = [];

      nodes.forEach(n => {
        if (n.nodeName === 'H2') { outerNodes.push(n); inCard = true; }
        else if (inCard) cardNodes.push(n);
        else outerNodes.push(n);
      });

      container.innerHTML = '';
      outerNodes.forEach(n => container.appendChild(n));
      cardNodes.forEach(n => card.appendChild(n));

      const pElements = [...card.querySelectorAll('p')];
      pElements.forEach((p, i) => {
        if (i === 0 && p.querySelector('strong')) p.classList.add('price-main');
        else if (i === 1) p.classList.add('price-subtitle');
        else if (i === 2 && p.querySelector('strong')) p.classList.add('price-seats');
        else if (i === 3) p.classList.add('price-note');
        else p.classList.add('price-closing');
      });

      container.appendChild(card);
    } catch (e) {
      console.warn('enhancePricing failed:', e);
    }
  }

  // ─── POST-PROCESS: FAQ ACCORDION ─────────────────────────
  function enhanceFAQ() {
    const container = document.querySelector('.section--faq .container');
    if (!container) return;
    try {
      const h2    = container.querySelector('h2');
      const paras = [...container.querySelectorAll('p')];

      const faqList = document.createElement('div');
      faqList.className = 'faq-list';

      let i = 0;
      while (i < paras.length) {
        const p       = paras[i];
        const strong  = p.querySelector('strong');
        const isQ     = strong && p.textContent.trim() === strong.textContent.trim();
        if (isQ) {
          const qText = strong.textContent;
          const aText = paras[i + 1] ? paras[i + 1].textContent : '';

          const item   = document.createElement('div');
          item.className = 'faq-item';
          const qEl    = document.createElement('div');
          qEl.className = 'faq-q';
          qEl.textContent = qText;
          const aEl    = document.createElement('div');
          aEl.className = 'faq-a';
          const aInner = document.createElement('div');
          aInner.className = 'faq-a-inner';
          aInner.textContent = aText;
          aEl.appendChild(aInner);
          qEl.addEventListener('click', () => item.classList.toggle('open'));
          item.appendChild(qEl);
          item.appendChild(aEl);
          faqList.appendChild(item);
          i += 2;
        } else {
          i++;
        }
      }

      container.innerHTML = '';
      if (h2) container.appendChild(h2);
      container.appendChild(faqList);
    } catch (e) {
      console.warn('enhanceFAQ failed:', e);
    }
  }

  // ─── POST-PROCESS: CTA BUTTON ─────────────────────────────
  function enhanceCTA(meta) {
    const container = document.querySelector('.section--cta .container');
    if (!container) return;
    try {
      // Wire up any existing links to whatsapp
      container.querySelectorAll('a').forEach(a => {
        if (meta.whatsapp) {
          a.href = meta.whatsapp;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.classList.add('btn', 'btn-primary');
        }
      });

      // Add button if no link exists
      if (!container.querySelector('.btn') && meta.whatsapp) {
        const btn = document.createElement('a');
        btn.href      = meta.whatsapp;
        btn.target    = '_blank';
        btn.rel       = 'noopener noreferrer';
        btn.className = 'btn btn-primary';
        // El icono queda como marcador: enhanceIcons() lo rellena al final.
        btn.innerHTML =
          '<span class="su-icon" data-su-icon="message-circle"></span>' +
          '<span>Escríbeme "QUIERO" y reserva tu cupo</span>';

        // Find the direct child of container that contains (or is) an <em>,
        // so insertBefore gets a valid sibling — not a nested descendant.
        const emEl = container.querySelector('em');
        let refNode = emEl;
        while (refNode && refNode.parentNode !== container) {
          refNode = refNode.parentNode;
        }
        container.insertBefore(btn, refNode || null);
      }
    } catch (e) {
      console.warn('enhanceCTA failed:', e);
    }
  }

  // ─── POST-PROCESS: HERO LINK ──────────────────────────────
  function enhanceHero(meta) {
    const container = document.querySelector('.section--hero .container');
    if (!container) return;
    try {
      container.querySelectorAll('a').forEach(a => {
        const href = a.getAttribute('href');
        if (href === '#reserva' || href === '#') {
          if (meta.whatsapp) {
            a.href   = meta.whatsapp;
            a.target = '_blank';
            a.rel    = 'noopener noreferrer';
          } else {
            a.href = '#reserva';
          }
        }
        a.classList.add('btn', 'btn-primary');
      });
    } catch (e) {
      console.warn('enhanceHero failed:', e);
    }
  }

  // ─── POST-PROCESS: ICONOS ─────────────────────────────────
  // Rellena los marcadores <span class="su-icon" data-su-icon="x"> que vienen
  // de content.txt. Corre al final: los marcadores sobreviven a los movimientos
  // de nodos de los otros enhance*, y asi tambien se cubre el boton que
  // enhanceCTA crea desde cero.
  function enhanceIcons() {
    try {
      if (typeof window.suIcon !== 'function') return;
      document.querySelectorAll('[data-su-icon]').forEach(el => {
        const name = el.getAttribute('data-su-icon');
        if (!name || el.querySelector('svg')) return;
        el.innerHTML = window.suIcon(name);
      });
    } catch (e) {
      console.warn('enhanceIcons failed:', e);
    }
  }

  // ─── MAIN ─────────────────────────────────────────────────
  async function init() {
    try {
      const response = await fetch('./assets/content.txt');
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const text = await response.text();

      await domReady();

      const { meta, body } = parseFrontmatter(text);
      const sections = parseSections(body);

      if (meta.brand) {
        document.title = meta.brand;
        document.getElementById('footer-brand').textContent =
          `© ${new Date().getFullYear()} ${meta.brand}`;
      }

      const html = sections.map(buildSection).join('');
      document.getElementById('app').innerHTML = html;

      // Post-process each section
      enhanceForWho();
      enhancePricing();
      enhanceFAQ();
      enhanceCTA(meta);
      enhanceHero(meta);
      enhanceIcons();

      document.getElementById('footer').style.display = '';

    } catch (err) {
      document.getElementById('app').innerHTML = `
        <div class="error-state">
          <p class="error-title">Error al cargar el contenido.</p>
          <p>Este sitio requiere un servidor HTTP. Abre
            <code>index.html</code> desde un servidor local o GitHub Pages.</p>
          <small>${err.message}</small>
        </div>`;
    }
  }

  init();
  </script>
</body>
